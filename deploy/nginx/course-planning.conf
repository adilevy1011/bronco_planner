# Copy to /etc/nginx/sites-available/course-planning and update server_name/root.
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.com;

    root /var/www/bronco_planner/frontend;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Canonical extensionless page URLs.
    location = /login.html { return 301 /login; }
    location = /progress.html { return 301 /progress; }
    location = /settings.html { return 301 /settings; }
    location = /terms.html { return 301 /; }
    location = /login { try_files /login.html =404; }
    location = /progress { try_files /progress.html =404; }
    location = /settings { try_files /settings.html =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terms · CPP Course Planner</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="pages.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body data-page="terms">
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/"><span class="brand-mark">◆</span><span>Bronco Plan</span></a>
        <nav class="page-nav">
          <a class="active" href="/">Terms</a>
          <a href="/catalog">Catalog</a>
          <a href="/progress">Degree progress</a>
          <a href="/settings">Settings</a>
        </nav>
        <div class="topbar-actions">
          <button class="button button-dark" id="authButton">Log out</button>
        </div>
      </header>

      <main>
        
        <section class="planner-panel panel">
          <div class="section-heading">
            <div>
              <div class="eyebrow">YOUR ROADMAP</div>
              <h2>Term planner</h2>
            </div>
            <button class="button button-dark" id="addTerm">+ Add term</button>
          </div>
          <div class="planner-note" id="plannerNote"></div>
          <div class="terms" id="terms"></div>
        </section>
        <section class="summary-grid" id="summaryGrid"></section>

      </main>

    </div>

    <script src="app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catalog · CPP Course Planner</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="pages.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body data-page="catalog">
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/"><span class="brand-mark">◆</span><span>Bronco Plan</span></a>
        <nav class="page-nav">
          <a href="/">Terms</a>
          <a class="active" href="/catalog">Catalog</a>
          <a href="/progress">Degree progress</a>
          <a href="/settings">Settings</a>
        </nav>
        <div class="topbar-actions"><button class="button button-dark" id="authButton">Log out</button></div>
      </header>
      <main>
        <div class="page-heading"><div class="eyebrow">CATALOG</div><h1>Course library</h1><p>Search program courses, review GE tags, and add courses to your roadmap.</p></div>
        <section class="catalog-section">
          <div class="section-heading catalog-heading">
            <div><h2>Available courses</h2></div>
            <div class="catalog-controls"><input id="courseSearch" type="search" placeholder="Search courses..." /><select id="categoryFilter"><option value="all">All requirements</option></select></div>
          </div>
          <div class="course-grid" id="courseGrid"></div>
        </section>
      </main>
      <footer>CPP catalog data · <span id="courseCount"></span></footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>
